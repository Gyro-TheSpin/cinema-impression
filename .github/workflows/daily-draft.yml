name: daily-draft

# 1日1本だけ下書きを作る。大量生成は量産判定リスクがあるため本数は増やさない。
on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = JST 09:00
  workflow_dispatch: {} # 手動実行も可

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 次の1本の下書きを作成
        env:
          BATCH: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 任意（なくても extract で下書きになる）
        run: python3 tools/next_draft.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily draft: next film overview"
          git push
